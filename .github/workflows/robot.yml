name: Robot de noticias — Caso Caquetá

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer noticias y videos
        run: node scripts/robot.mjs
      - name: Guardar si hay novedades
        run: |
          git config user.name "robot-vibras"
          git config user.email "robot@vibraspositivashm.com"
          git add data/noticias.json
          git commit -m "Robot: noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') (hora Colombia)" || echo "Sin cambios"
          git pull --rebase
          git push
